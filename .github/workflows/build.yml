name: Build and check
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Build, checks and portable package
        shell: pwsh
        run: ./scripts/build.ps1 -Zip
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ClipDock-win-x64
          path: artifacts/ClipDock-win-x64.zip
