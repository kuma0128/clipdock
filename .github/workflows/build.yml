name: Build and check
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Build, checks and portable package
        shell: pwsh
        run: ./scripts/build.ps1 -Zip
      - name: Install verified Inno Setup 7.1.1 on the disposable runner
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_ACTIONS -cne 'true' -or $env:RUNNER_ENVIRONMENT -cne 'github-hosted') {
            throw 'Tool installation is restricted to a disposable GitHub-hosted runner.'
          }
          $download = Join-Path $env:RUNNER_TEMP 'innosetup-7.1.1-x64.exe'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_1/innosetup-7.1.1-x64.exe' -OutFile $download
          $expectedHash = '8a5a6711c3766a6e5fb74f280ba0e3551e719ce94538d901fdbd1f8f9920b3f0'
          if ((Get-FileHash -LiteralPath $download -Algorithm SHA256).Hash -ne $expectedHash) {
            throw 'Inno Setup checksum mismatch.'
          }
          $signature = Get-AuthenticodeSignature -LiteralPath $download
          if ($signature.Status -ne 'Valid' -or $null -eq $signature.SignerCertificate -or
              $signature.SignerCertificate.GetNameInfo('SimpleName', $false) -ne 'Pyrsys B.V.') {
            throw 'Inno Setup does not have the expected valid publisher signature.'
          }
          $compilerDirectory = Join-Path $env:LOCALAPPDATA 'Programs\Inno Setup 7'
          $toolSetup = Start-Process -FilePath $download -ArgumentList @('/CURRENTUSER', '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', "/DIR=`"$compilerDirectory`"") -WindowStyle Hidden -PassThru
          try {
            if (-not $toolSetup.WaitForExit(180000) -or $toolSetup.ExitCode -ne 0) {
              throw 'Inno Setup installation failed or timed out.'
            }
          }
          finally { $toolSetup.Dispose() }
          $compilerVersion = (& (Join-Path $compilerDirectory 'ISCC.exe') --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $compilerVersion -ne '7.1.1') { throw 'Unexpected Inno Setup compiler version.' }
          $compilerDirectory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build unsigned development installer
        shell: pwsh
        run: ./scripts/build-installer.ps1 -AllowUnsignedDevelopment
      - name: Check installer install, update and uninstall lifecycle
        shell: pwsh
        run: ./scripts/test-installer.ps1
      - name: Upload installer lifecycle logs
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: installer-lifecycle-logs
          path: artifacts/installer/smoke-logs
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ClipDock-win-x64
          path: artifacts/ClipDock-win-x64.zip
