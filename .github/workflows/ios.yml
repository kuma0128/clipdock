name: iPhone app
on:
  workflow_dispatch:
    inputs:
      public_sites:
        description: Also exercise public X, YouTube, Twitch and HTML video links
        type: boolean
        default: false
  push:
    branches: [main]
    tags: ['ios-v*']
    paths:
      - 'src/ClipDock.iOS/**'
      - 'src/ClipDock.Mac/icon.png'
      - 'scripts/ios/**'
      - 'tests/iOS/**'
      - '.github/workflows/ios.yml'
permissions:
  contents: read
jobs:
  ios:
    permissions:
      contents: write
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v7
      - name: Prepare the Xcode project
        run: |
          command -v xcodegen || brew install xcodegen
          bash scripts/ios/prepare.sh
          xcodegen generate --spec src/ClipDock.iOS/project.yml
      - name: Build the iPhone IPA
        run: bash scripts/ios/package.sh
      - name: Check YouTube access from the simulator host
        if: inputs.public_sites
        continue-on-error: true
        env:
          PYTHONPATH: ${{ github.workspace }}/artifacts/ios-deps/packages
        run: |
          uv run --no-project --python 3.14 python -m yt_dlp --ignore-config --no-playlist \
            --js-runtimes node --simulate --print '%(id)s %(format_id)s' \
            'https://www.youtube.com/watch?v=HOfdboHvshg'
      - name: Check paste and save on an iPhone simulator
        run: |
          uv run --no-project python tests/iOS/fixture.py &
          fixture=$!
          trap 'kill "$fixture" 2>/dev/null || true' EXIT
          curl --fail --retry 60 --retry-connrefused --retry-delay 1 http://127.0.0.1:18741/watch
          device=$(xcrun simctl list devices available -j | jq -er 'first(.devices | to_entries[] | select(.key | startswith("com.apple.CoreSimulator.SimRuntime.iOS-26-")) | .value[] | select(.name | startswith("iPhone")) | .udid)')
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b
          xcodebuild -project src/ClipDock.iOS/ClipDock.xcodeproj -scheme ClipDock \
            -destination "id=$device" -parallel-testing-enabled NO CLIPDOCK_PUBLIC_SITES=${{ inputs.public_sites && '1' || '0' }} \
            -derivedDataPath artifacts/ios/sim-build -resultBundlePath artifacts/ios/paste.xcresult test -quiet
          container=$(xcrun simctl get_app_container "$device" app.clipdock.ios data)
          cmp "$container/Documents/ClipDock Sample (1).mp4" tests/iOS/sample.mp4
          swift - "$container/Documents" ${{ inputs.public_sites && '1' || '0' }} <<'SWIFT'
          import AVFoundation
          let folder = URL(fileURLWithPath: CommandLine.arguments[1])
          for name in ["split.mp4", "segments.mp4", "fragments.mp4"] {
              let asset = AVURLAsset(url: folder.appendingPathComponent(name))
              let tracks = try await asset.load(.tracks)
              let duration = try await asset.load(.duration).seconds
              precondition(tracks.contains { $0.mediaType == .video } && duration > 0)
              if name != "fragments.mp4" { precondition(tracks.contains { $0.mediaType == .audio }) }
              if name == "segments.mp4" { precondition((1.0...1.5).contains(duration)) }
          }
          if CommandLine.arguments[2] == "1" {
              let files = try FileManager.default.contentsOfDirectory(at: folder, includingPropertiesForKeys: nil)
              for title in ["Jocelyn Laidlaw", "Sintel", "EA Play", "FreshStock", "HTML Video"] {
                  guard let file = files.first(where: { $0.lastPathComponent.contains(title) })
                  else { fatalError("Missing saved video: " + title) }
                  let asset = AVURLAsset(url: file)
                  let tracks = try await asset.load(.tracks)
                  precondition(tracks.contains { $0.mediaType == .video } && tracks.contains { $0.mediaType == .audio })
                  if title == "Sintel" {
                      let duration = try await asset.load(.duration).seconds
                      precondition((51...54).contains(duration))
                  }
              }
          }
          SWIFT
          cmp "$container/Documents/tone.wav" <(curl -fsS http://127.0.0.1:18741/tone.wav)
          xcrun simctl terminate "$device" app.clipdock.ios || true
          xcrun simctl ui "$device" appearance light
          xcrun simctl launch "$device" app.clipdock.ios -AppleLanguages '(ja)' -AppleLocale ja_JP
          sleep 2
          xcrun simctl io "$device" screenshot artifacts/ios/simulator.png
          xcrun simctl terminate "$device" app.clipdock.ios
          xcrun simctl ui "$device" appearance dark
          xcrun simctl launch "$device" app.clipdock.ios -AppleLanguages '(en)' -AppleLocale en_US
          sleep 2
          xcrun simctl io "$device" screenshot artifacts/ios/simulator-dark.png
      - name: Attach verified IPA to the iPhone release draft
        if: startsWith(github.ref, 'refs/tags/ios-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(plutil -extract CFBundleShortVersionString raw artifacts/ios/build/Build/Products/Release-iphoneos/ClipDock.app/Info.plist)
          tag="$GITHUB_REF_NAME"
          test "$tag" = "ios-v$version"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            minimum=$(plutil -extract MinimumOSVersion raw artifacts/ios/build/Build/Products/Release-iphoneos/ClipDock.app/Info.plist)
            gh release create "$tag" --verify-tag --draft --latest=false --title "ClipDock for iPhone $version" --notes "iOS ${minimum%.0}以降のiPhoneに対応しています。"
          fi
          test "$(gh release view "$tag" --json isDraft --jq .isDraft)" = true
          gh release upload "$tag" artifacts/ios/*.ipa artifacts/ios/*.sha256 artifacts/ios/simulator*.png --clobber
      - uses: actions/upload-artifact@v7.0.2
        if: failure()
        continue-on-error: true
        with:
          name: iPhone-test-results
          path: artifacts/ios/paste.xcresult
          retention-days: 3
      - uses: actions/upload-artifact@v7.0.2
        if: github.event_name == 'workflow_dispatch'
        with:
          name: ClipDock-iOS
          path: |
            artifacts/ios/*.ipa
            artifacts/ios/*.sha256
            artifacts/ios/simulator*.png
          retention-days: 1
