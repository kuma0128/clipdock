name: ClipDock
options:
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: en
settings:
  SWIFT_VERSION: "5.0"
  TARGETED_DEVICE_FAMILY: "1"
  MARKETING_VERSION: "1.3.0"
  CURRENT_PROJECT_VERSION: 4
targets:
  ClipDock:
    type: application
    platform: iOS
    sources:
      - App
      - ../../artifacts/ios-deps/Assets.xcassets
    dependencies:
      - framework: ../../artifacts/ios-deps/Python.xcframework
        embed: true
      - framework: ../../artifacts/ios-deps/ClipDockRemux.xcframework
        embed: true
      - sdk: JavaScriptCore.framework
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: app.clipdock.ios
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_KEY_CFBundleDisplayName: ClipDock
      INFOPLIST_FILE: Info.plist
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
      INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      CLANG_WARN_QUOTED_INCLUDE_IN_FRAMEWORK_HEADER: NO
      INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
      HEADER_SEARCH_PATHS: '"$(BUILT_PRODUCTS_DIR)/Python.framework/Headers"'
      SWIFT_OBJC_BRIDGING_HEADER: App/EngineBridge.h
      ENABLE_USER_SCRIPT_SANDBOXING: NO
    postBuildScripts:
      - name: Install embedded media engine
        shell: /bin/bash
        basedOnDependencyAnalysis: false
        script: |
          set -e
          deps="../../artifacts/ios-deps"
          source "$PROJECT_DIR/$deps/Python.xcframework/build/utils.sh"
          export EXPANDED_CODE_SIGN_IDENTITY="${EXPANDED_CODE_SIGN_IDENTITY:--}"
          install_python "$deps/Python.xcframework"
          rm -rf "$CODESIGNING_FOLDER_PATH/python/lib/python3.14/test"
          rsync -a --delete --exclude '__pycache__' "$PROJECT_DIR/$deps/packages/" "$CODESIGNING_FOLDER_PATH/packages/"
          cp "$PROJECT_DIR"/Engine/*.py "$CODESIGNING_FOLDER_PATH/packages/"
          cp "$PROJECT_DIR/$deps/ffmpeg-8.1.3/COPYING.LGPLv2.1" "$CODESIGNING_FOLDER_PATH/FFmpeg-LICENSE.txt"
          cp "$PROJECT_DIR/RuntimeNotices.txt" "$PROJECT_DIR/../../LICENSE" "$PROJECT_DIR/../../THIRD-PARTY.md" "$PROJECT_DIR/$deps/VERSIONS" "$CODESIGNING_FOLDER_PATH/"
  ClipDockUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [../../tests/iOS/ClipDockUITests.swift]
    dependencies:
      - target: ClipDock
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: app.clipdock.ios.uitests
      GENERATE_INFOPLIST_FILE: YES
schemes:
  ClipDock:
    build:
      targets:
        ClipDock: all
    test:
      targets: [ClipDockUITests]
      environmentVariables:
        CLIPDOCK_PUBLIC_SITES: "$(CLIPDOCK_PUBLIC_SITES)"
